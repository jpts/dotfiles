{{- $os_pattern := printf "?%s" (substr 1 (int (len .chezmoi.os)) .chezmoi.os) -}}

{{- range $k, $v := .binaries}}
{{- if has $.osarch ($v.arch | keys) }}
{{- $asset_pattern := .asset_pattern | replace "OS" $os_pattern | replace "UNAME_ARCH" $.uarch | replace "ARCH" $.chezmoi.arch | replace "VER" (trimPrefix "v" .version) }}
{{- $default_path := ternary (get . "path") $k (has "path" (.|keys)) }}
{{- $default_tool_path :=  printf ".local/bin/%s" (base $default_path) }}
{{- $target_path := get . "targetPath" | replace "OS" $.chezmoi.os | replace "UNAME_ARCH" $.uarch  }}
{{- $type := (ternary "archive-file" "file" (or (contains ".tar." $asset_pattern) (hasSuffix ".zip" $asset_pattern))) }}

{{ $k }}:
  type: {{ $type }}
  url: {{ gitHubReleaseAssetURL .repo .version $asset_pattern }}
  path: {{ $default_path | replace "OS" $.chezmoi.os | replace "UNAME_ARCH" $.uarch | replace "ARCH" $.chezmoi.arch | replace "VER" (trimPrefix "v" .version) }}
  stripComponents: {{ default 0 (get . "stripComponents") }}
  targetPath: {{ default $default_tool_path $target_path }}
  checksum:
    sha256: "{{ index .arch $.osarch }}"
{{- end }}
{{- end }}
